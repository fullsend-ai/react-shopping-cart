# Demo overlay: widen triage auto-promotion beyond the stock categories.
# Composes the stock triage harness (pinned to the v0.56.0 agents release)
# and overrides only TRIAGE_AUTO_CODE_CATEGORIES — with TRIAGE_AUTO_CODE=on
# (inherited from the base), the post-script promotes every sufficient
# issue in the categories listed below to ready-to-code, so the pipeline
# runs triage -> code -> review -> merge with no human step.
#
# Category vocabulary (agents/triage.md): bug | performance | security |
# documentation | feature | other.
#
# Excluded by design (authorized by issue #11):
#   - `security`: security reports are not auto-fixed in public.
#   - `other`: the catch-all; unclassifiable issues do not auto-promote.
base: https://raw.githubusercontent.com/fullsend-ai/agents/7c6f06a74a09fca05815834485e9ce4fac58dcb5/harness/triage.yaml#sha256=82d6dba086263b3b0e8bb38b3f6fdd8ec41be8bca846ab42af7779b38fd09e15

env:
  runner:
    TRIAGE_AUTO_CODE_CATEGORIES: "bug,performance,documentation,feature"
  sandbox:
    TRIAGE_AUTO_CODE_CATEGORIES: "bug,performance,documentation,feature"
