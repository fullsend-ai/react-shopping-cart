# Demo: merge agent-authored PRs when the fullsend review agent approves.
# On the review agent's approving review, squash-merges the exact commit
# that was approved, completing issue -> triage -> code -> review -> merge
# with no human step. Controls, in order:
#   1. Gate: the job runs only on the review agent's approving review of
#      a non-draft coder-bot PR (the `if:` below).
#   2. Human veto: the merge aborts if any reviewer's latest opinionated
#      review (COMMENTED/PENDING excluded) is CHANGES_REQUESTED — a human
#      "no" outranks the bot's approval. A DISMISSED review does not
#      veto: dismissing requires write access on this private repo, so
#      the dismissal is itself a deliberate human override.
#   3. Commit binding: --match-head-commit merges only the exact commit
#      the review approved; a later push breaks the match (fail-closed)
#      and the next approval retries on the new head.
#   4. Path allowlist: only PRs whose every changed path — old and new
#      names — is under src/ or public/ are auto-merged. Everything else
#      (workflows, manifests, build config, agent instruction files,
#      renames from anywhere) requires a human merge.
# All guards capture their API output first, so an API failure aborts
# the job (fail-closed) rather than skipping the check. Branch protection
# is unavailable on this repository (private repo on a Free plan); the
# controls are deterministic and do not depend on it. Authorized by
# issue #11 — see its "Controls in the shipped design" and "Accepted
# risk" sections for the matching record.
name: merge agent PRs on clean review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

concurrency:
  group: merge-agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  merge-on-clean-review:
    # Runs only when the fullsend review agent just approved a PR authored
    # by the fullsend coder bot. Every fresh approval retries the merge,
    # which also covers the review -> fix -> re-review loop.
    if: >-
      github.event.review.user.login == 'fullsend-ai-review[bot]'
      && github.event.review.state == 'approved'
      && github.event.pull_request.user.login == 'fullsend-ai-coder[bot]'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Merge the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: |
          set -euo pipefail

          # Control 2 — human veto. Latest opinionated review per author
          # (COMMENTED/PENDING excluded); CHANGES_REQUESTED vetoes. The
          # output is captured first: an API failure aborts the job here
          # instead of silently skipping the check.
          vetoes=$(gh pr view "$PR_URL" --json reviews --jq '
            [.reviews[] | select(.state != "COMMENTED" and .state != "PENDING")]
            | group_by(.author.login) | map(last)
            | .[] | select(.state == "CHANGES_REQUESTED") | .author.login')
          if [ -n "$vetoes" ]; then
            echo "::error::A reviewer's latest review is CHANGES_REQUESTED; a human veto outranks the bot approval. Not merging."
            exit 1
          fi

          # Control 4 — path allowlist. Every changed path (old and new
          # names, all pages) must be under src/ or public/. Captured
          # first so an API failure aborts the job.
          files=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')
          if [ -z "$files" ]; then
            echo "::error::Could not read the PR's changed files; refusing to merge."
            exit 1
          fi
          if grep -qvE '^src/|^public/' <<<"$files"; then
            echo "::error::PR changes paths outside src/ and public/; a human must merge it. Not merging."
            exit 1
          fi

          # Control 3 — merge only the exact approved commit.
          gh pr merge --squash --match-head-commit "$REVIEW_SHA" "$PR_URL"
