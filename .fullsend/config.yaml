# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    # Demo: repo-local triage overlay that auto-promotes every sufficient
    # issue (all categories except security) to ready-to-code.
    # See .fullsend/triage.yaml.
    - name: triage
      source: triage.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
create_issues:
    allow_targets:
        repos:
            - fullsend-ai/fullsend
            - fullsend-ai/agents
inference:
    project: it-gcp-fullsend-demo
    wif_provider: projects/508990529289/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-shairevivo-react-shopping-car
