# Demo: enable GitHub auto-merge on PRs opened by the fullsend coder bot.
# With branch protection on main requiring one approval, the review agent's
# approving review satisfies the requirement and GitHub merges the PR
# automatically — completing issue -> triage -> code -> review -> merge
# with no human step. (GitHub requires auto-merge to be enabled per PR,
# and the agent does not click it itself.)
name: enable auto-merge for agent PRs

on:
  pull_request_target:
    types: [opened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: github.event.pull_request.user.login == 'fullsend-ai-coder[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
