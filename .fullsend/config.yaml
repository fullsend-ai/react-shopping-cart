# fullsend per-repo configuration
# https://github.com/fullsend-ai/fullsend
#
# This file configures fullsend for per-repo installation mode.
# See https://fullsend.sh/docs/guides/infrastructure/layered-config-reference
version: "1"
runtime: claude
roles:
    - triage
    - coder
    - review
    - fix
    - retro
    - prioritize
agents:
    # Demo: repo-local triage overlay that auto-promotes every sufficient
    # issue in bug/performance/documentation/feature to ready-to-code
    # (security and other are excluded). See .fullsend/triage.yaml.
    - name: triage
      source: triage.yaml
allowed_remote_resources:
    - https://raw.githubusercontent.com/fullsend-ai/fullsend/
    - https://raw.githubusercontent.com/fullsend-ai/agents/
tracker:
    jira:
        base_url: https://redhat.atlassian.net
        project: TSTAPP
        poll:
            enabled: true
# Authorize Jira actors by explicit account ID instead of resolving Jira
# project role names. With write:/triage: set, the poller never reads the
# project role roster, so it no longer needs Administer Projects, and
# actors cannot fall through to "external" when role membership is not
# where the poller expects it.
authorization:
    - provider: jira
      write:
          accounts:
              - 70121:fb5099b2-e796-48e1-b80e-16be004984fb
      triage:
          accounts:
              - 70121:fb5099b2-e796-48e1-b80e-16be004984fb
inference:
    project: it-gcp-fullsend-demo
    wif_provider: projects/508990529289/locations/global/workloadIdentityPools/fullsend-inference/providers/gh-fullsend-ai-react-shopping-ca
