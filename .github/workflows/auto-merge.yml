# Demo: merge agent-authored PRs when the fullsend review agent approves.
# On the review agent's approving review, squash-merges the exact commit
# that was approved, completing issue -> triage -> code -> review -> merge
# with no human step. Two controls:
#   1. The gate is the review agent's approving-review event itself —
#      nothing runs before an approval exists.
#   2. --match-head-commit binds the merge to the reviewed commit: if the
#      PR head moved after the approval, the merge fails (fail-closed) and
#      the next approval retries on the new head. This control does not
#      depend on branch protection.
# Branch protection is unavailable on this repository (private repo on a
# Free plan); the commit binding is the compensating control, recorded in
# issue #11.
#
# Authorized by issue #11. Accepted risk (demo repository): the human
# merge gate is intentionally removed for agent-authored PRs.
name: merge agent PRs on clean review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  merge-on-clean-review:
    # Runs only when the fullsend review agent just approved a PR authored
    # by the fullsend coder bot. Every fresh approval retries the merge,
    # which also covers the review -> fix -> re-review loop. Draft PRs are
    # excluded.
    if: >-
      github.event.review.user.login == 'fullsend-ai-review[bot]'
      && github.event.review.state == 'approved'
      && github.event.pull_request.user.login == 'fullsend-ai-coder[bot]'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge the approved commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REVIEW_SHA: ${{ github.event.review.commit_id }}
        run: gh pr merge --squash --match-head-commit "$REVIEW_SHA" "$PR_URL"
