# Demo: merge agent-authored PRs when the fullsend review agent approves.
# Arms GitHub auto-merge (squash) at the moment of a clean review, so the
# pipeline runs issue -> triage -> code -> review -> merge with no human
# step. Arming on the approval event itself is the gate: nothing is ever
# armed — and no merge can happen — before a review-agent approval exists,
# whatever branch protection says. (GitHub requires auto-merge to be
# enabled per PR; the agent does not do it itself.)
#
# Authorized by issue #11. Accepted risk (demo repository): the human
# merge gate is intentionally removed for agent-authored PRs.
name: merge agent PRs on clean review

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  merge-on-clean-review:
    # Arm only when the fullsend review agent just approved a PR authored
    # by the fullsend coder bot. Every fresh approval re-attempts arming,
    # which also covers the review -> fix -> re-review loop. Draft PRs are
    # excluded (GitHub rejects auto-merge on drafts); a draft marked ready
    # re-arms on its next approved review. dismiss_stale_reviews on main
    # means a post-approval push dismisses the approval and auto-merge
    # waits for the next one.
    if: >-
      github.event.review.user.login == 'fullsend-ai-review[bot]'
      && github.event.review.state == 'approved'
      && github.event.pull_request.user.login == 'fullsend-ai-coder[bot]'
      && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Arm auto-merge after clean review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
