version: 2

updates:
  # npm: security fixes grouped into one reviewable PR; routine dev-dependency
  # bumps grouped and capped so alert noise stays reviewable.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      # commitlint packages are released in lockstep; the CLI and the preset
      # must move together (including majors), or the commit-msg hook breaks.
      # Listed before dev-minor-patch so it claims these packages first.
      commitlint:
        applies-to: version-updates
        patterns: ["@commitlint/*"]
      dev-minor-patch:
        applies-to: version-updates
        dependency-type: development
        update-types: ["minor", "patch"]
    ignore:
      # react-scripts 5.x is the end of the line; CRA is deprecated, so a
      # major bump has no target version and would only produce failures.
      - dependency-name: react-scripts
        update-types: ["version-update:semver-major"]
      # react-scripts 5.0.1 caps its typescript peer at "^3.2.1 || ^4", and its
      # toolchain (fork-ts-checker, @typescript-eslint) needs the JS compiler
      # API. Stay on TypeScript 4.x; remove this rule when leaving CRA.
      - dependency-name: typescript
        versions: [">=5"]
      # package.json pins @types/node to 22.9.3 exactly: it is the "ts4.9"
      # dist-tag, and every later release (22.x minors/patches included)
      # declares typeScriptVersion >=5.0, which TypeScript 4.9 does not
      # support. Ignore everything above the pin while on TypeScript 4.x.
      # When the typescript rule above is removed, relax this to
      # [">=23"]: the major must track the oldest supported Node runtime
      # (engines.node ">=22.22.1"), so raise it together with engines.node.
      - dependency-name: "@types/node"
        versions: [">22.9.3"]

  # Keep the SHA-pinned action refs in .github/workflows fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
